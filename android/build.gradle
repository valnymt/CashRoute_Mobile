buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "28.2.13676358"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
    }
}

// The camera library pins API 35. Build it with the app's installed compile SDK.
def imagePicker = findProject(":react-native-image-picker")
if (imagePicker != null) {
    imagePicker.pluginManager.withPlugin("com.android.library") {
        imagePicker.extensions.getByName("androidComponents").finalizeDsl { androidDsl ->
            androidDsl.compileSdk = rootProject.ext.compileSdkVersion
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
